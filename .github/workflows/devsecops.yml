name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ─── Job 1: Build & Test ────────────────────────────────────────────────────
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─── Job 2: SAST Scan (Bandit) ──────────────────────────────────────────────
  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build              # Hanya jalan jika job build berhasil

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json \
            --exit-zero

      - name: Display Bandit summary
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format txt

      - name: Quality Gate — fail on HIGH severity issues
        run: |
          HIGH=$(python3 -c "
          import json, sys
          with open('bandit-report.json') as f:
            data = json.load(f)
          high = [r for r in data.get('results', []) if r['issue_severity'] == 'HIGH']
          print(len(high))
          ")
          echo "High severity issues found: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "Quality Gate FAILED: $HIGH HIGH severity issue(s) found."
            echo "Fix HIGH severity issues before merging."
            exit 1
          else
            echo "Quality Gate PASSED: No HIGH severity issues."
          fi

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 14
